name: Build

# Catches a broken build early: same PyInstaller run as the release, minus the
# bundled tools (250 MB of downloads) and minus publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The tests are platform-independent and the program now runs on three, so
  # they run on all three; only Windows builds the exe.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile every module
        run: python -m compileall -q trackhound main.py

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm trackhound.spec

      - name: Check the build starts
        shell: pwsh
        run: |
          $out = & ./dist/Trackhound/Trackhound-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Trackhound-cli.exe --help exited with $LASTEXITCODE" }
          foreach ($file in "dist/Trackhound/Trackhound.exe", "dist/Trackhound/_internal/trackhound/web/index.html",
                            "dist/Trackhound/_internal/trackhound/web/app.js", "dist/Trackhound/_internal/trackhound/web/style.css") {
            if (-not (Test-Path $file)) { throw "missing from the build: $file" }
          }

      # So that a broken trackhound.iss shows up here and not on release day
      - name: Build the installer
        shell: pwsh
        run: |
          $found = (Get-Command iscc.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --no-progress -y }
          ./scripts/build-installer.ps1
