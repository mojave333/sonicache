name: Build

# Catches a broken build early: same PyInstaller run as the release, minus the
# bundled tools (250 MB of downloads) and minus publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The tests are platform-independent and the program now runs on three, so
  # they run on all three; only Windows builds the exe.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

  # What PyPI would get: the package builds, installs into a clean
  # environment, and its engine imports without the window's dependencies.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Install into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/trackhound --help
          /tmp/clean/bin/python -c "import sys, trackhound.engine; assert 'webview' not in sys.modules"

  # The same builds the release makes for macOS (Apple Silicon and Intel) and Linux,
  # each started once to see that the window opens
  macos:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon, and the last Intel Macs GitHub still offers
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch ffmpeg and Deno
        run: scripts/fetch-vendor.sh

      # Builds, starts the command line and the window, and packs the result
      - name: Build
        shell: bash  # with pipefail, unlike the default: a failed build must not hide behind tee
        run: |
          scripts/build-unix.sh dev | tee build.log
          echo "package=$(tail -n 1 build.log)" >> "$GITHUB_ENV"

      # A week to try a build before it is released
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.package }}
          path: ${{ env.package }}
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt WebEngine's own dependencies, bundled from here; xvfb only for the
      # check that the window opens
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libnss3 libasound2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch ffmpeg and Deno
        run: scripts/fetch-vendor.sh

      # Builds, starts the command line and the window, and packs the result
      - name: Build
        shell: bash  # with pipefail, unlike the default: a failed build must not hide behind tee
        run: |
          scripts/build-unix.sh dev | tee build.log
          echo "package=$(tail -n 1 build.log)" >> "$GITHUB_ENV"

      # A week to try a build before it is released
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.package }}
          path: ${{ env.package }}
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile every module
        run: python -m compileall -q trackhound main.py

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm trackhound.spec

      - name: Check the build starts
        shell: pwsh
        run: |
          $out = & ./dist/Trackhound/Trackhound-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Trackhound-cli.exe --help exited with $LASTEXITCODE" }
          foreach ($file in "dist/Trackhound/Trackhound.exe", "dist/Trackhound/_internal/trackhound/web/index.html",
                            "dist/Trackhound/_internal/trackhound/web/app.js", "dist/Trackhound/_internal/trackhound/web/style.css") {
            if (-not (Test-Path $file)) { throw "missing from the build: $file" }
          }

      # So that a broken trackhound.iss shows up here and not on release day
      - name: Build the installer
        shell: pwsh
        run: |
          $found = (Get-Command iscc.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --no-progress -y }
          ./scripts/build-installer.ps1
