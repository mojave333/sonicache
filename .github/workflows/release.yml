name: Release

# Releasing takes no local commands. Open Actions -> Release -> Run workflow,
# type the version (1.1.0), and the job writes __version__, commits it, tags the
# commit, builds the exe and the installer, and publishes the release with both.
# The pypi job then puts the same version of the Python package on PyPI.
#
# Tagging by hand still works for anyone who prefers it:
#
#     git tag v1.1.0 && git push origin v1.1.0
#
# That path checks the tag against __version__ and stops if they disagree.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}".Trim().TrimStart("v")
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not in the X.Y.Z form the tags use"
          }
          "version=$version" >> $env:GITHUB_ENV
          "tag=v$version" >> $env:GITHUB_ENV
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Output "releasing v$version"

      # Started from the Actions tab: the version in the source, the commit and
      # the tag are all made here, so nothing has to be prepared beforehand.
      - name: Write the version and tag the commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (git ls-remote --tags origin "refs/tags/$env:tag") {
            throw "$env:tag already exists. Pick a version that has not been released."
          }
          $init = "trackhound/__init__.py"
          $text = Get-Content $init -Raw
          $updated = [regex]::Replace($text, '__version__ = "[^"]+"', "__version__ = `"$env:version`"")
          if ($updated -ne $text) {
            # Written through .NET so the encoding cannot depend on which
            # PowerShell is running: Set-Content -Encoding utf8 adds a byte
            # order mark on 5.1 and none on 7.
            [IO.File]::WriteAllText((Resolve-Path $init), $updated, [Text.UTF8Encoding]::new($false))
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $init
            git commit -m "Release $env:tag"
            git push
          } else {
            Write-Output "__version__ already says $env:version"
          }
          git tag $env:tag
          git push origin $env:tag

      - name: Check the tag against __version__
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $source = (Select-String -Path trackhound/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Output "tag $env:version, __version__ $source"
          if ($source -ne $env:version) {
            throw "Tag $env:version does not match __version__ $source in trackhound/__init__.py"
          }

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The release publishes itself now, so the tests have to run here too and
      # not only in ci.yml: nothing else stands between a broken commit and a
      # download page.
      - name: Tests
        run: python -m pytest -q

      - name: Fetch ffmpeg and Deno
        shell: pwsh
        run: ./scripts/fetch-vendor.ps1

      - name: Build
        run: pyinstaller --noconfirm trackhound.spec

      - name: Check the build starts
        shell: pwsh
        run: |
          $out = & ./dist/Trackhound/Trackhound-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Trackhound-cli.exe --help exited with $LASTEXITCODE" }
          foreach ($file in "dist/Trackhound/Trackhound.exe", "dist/Trackhound/_internal/trackhound/web/index.html",
                            "dist/Trackhound/_internal/bin/ffmpeg.exe", "dist/Trackhound/_internal/bin/deno.exe") {
            if (-not (Test-Path $file)) { throw "missing from the build: $file" }
          }

      - name: Build the installer
        shell: pwsh
        run: |
          # The runner image ships Inno Setup, but not every image generation has
          $found = (Get-Command iscc.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --no-progress -y }
          ./scripts/build-installer.ps1

      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Trackhound/* -DestinationPath "Trackhound-$env:tag-windows-x64.zip"
          $setup = Get-ChildItem dist/Trackhound-*-windows-x64-setup.exe | Select-Object -First 1
          Move-Item $setup.FullName "Trackhound-$env:tag-windows-x64-setup.exe"
          "archive=Trackhound-$env:tag-windows-x64.zip" >> $env:GITHUB_ENV
          "installer=Trackhound-$env:tag-windows-x64-setup.exe" >> $env:GITHUB_ENV
          # Published in the release notes: the build is unsigned, so the hash is
          # the only way a reader can tell a download apart from someone's reupload.
          foreach ($pair in @{ sha256 = "Trackhound-$env:tag-windows-x64.zip"
                               installer_sha256 = "Trackhound-$env:tag-windows-x64-setup.exe" }.GetEnumerator()) {
            "$($pair.Key)=$((Get-FileHash $pair.Value -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_ENV
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Trackhound-windows-x64
          path: |
            ${{ env.archive }}
            ${{ env.installer }}

      # A draft left by an earlier run would keep its own notes, so new files
      # would hang under text written for the old ones. A draft has been
      # announced to nobody, so clear it and let the release be written again
      # from scratch. A published release is never touched.
      - name: Clear a leftover draft for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view "$env:tag" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $json) {
            if (($json | ConvertFrom-Json).isDraft) {
              Write-Output "Deleting the existing draft for $env:tag"
              gh release delete "$env:tag" --yes
            } else {
              Write-Output "$env:tag is already published; leaving it alone"
            }
          } else {
            Write-Output "No release for $env:tag yet"
          }
          exit 0

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          files: |
            ${{ env.installer }}
            ${{ env.archive }}
          draft: false
          generate_release_notes: true
          body: |
            Download `${{ env.installer }}` and run it. The installer asks where to put
            the program, offers a desktop shortcut, and starts it for you at the end.
            No administrator rights are needed: by default it installs for you alone,
            into `%LOCALAPPDATA%\Programs\Trackhound`, and uninstalls through
            Settings → Apps like any other program.

            If you would rather not use an installer, `${{ env.archive }}` sits beside
            it: unpack it anywhere and run `Trackhound.exe`.

            Nothing else has to be installed: ffmpeg and Deno are inside.
            `Trackhound-cli.exe` is the same program for a terminal.

            For macOS there is `Trackhound-${{ env.tag }}-macos-arm64.dmg` (Apple Silicon)
            and `Trackhound-${{ env.tag }}-macos-x64.dmg` (Intel), and for 64-bit Linux `Trackhound-${{ env.tag }}-linux-x64.tar.xz`; they are
            added a few minutes after this page appears. How to start them is in
            [macOS and Linux](https://github.com/mojave333/trackhound#macos-and-linux).

            Windows Defender may call this unsigned build `Trojan:Win32/Sabsik.EN.D!ml`.
            That is a false positive its machine learning raises against almost anything
            built with PyInstaller; what to do about it is in
            [Installing](https://github.com/mojave333/trackhound#installing).

            SHA-256 — installer `${{ env.installer_sha256 }}`,
            archive `${{ env.sha256 }}`. Check your copy with `Get-FileHash <file>`.

  # macOS (Apple Silicon and Intel) and Linux builds, attached once the Windows release
  # is out; a failure here leaves that release as it is
  macos:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon, and the last Intel Macs GitHub still offers
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.windows.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch ffmpeg and Deno
        run: scripts/fetch-vendor.sh

      # Builds, starts the command line and the window, and packs the result
      - name: Build
        shell: bash  # with pipefail, unlike the default: a failed build must not hide behind tee
        run: |
          scripts/build-unix.sh ${{ needs.windows.outputs.tag }} | tee build.log
          echo "package=$(tail -n 1 build.log)" >> "$GITHUB_ENV"

      # Added to the release the windows job published; the hash of every file
      # is shown by GitHub beside it
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.windows.outputs.tag }}" "$package" --clobber

  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.windows.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt WebEngine's own dependencies, bundled from here; xvfb only for the
      # check that the window opens
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libnss3 libasound2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch ffmpeg and Deno
        run: scripts/fetch-vendor.sh

      # Builds, starts the command line and the window, and packs the result
      - name: Build
        shell: bash  # with pipefail, unlike the default: a failed build must not hide behind tee
        run: |
          scripts/build-unix.sh ${{ needs.windows.outputs.tag }} | tee build.log
          echo "package=$(tail -n 1 build.log)" >> "$GITHUB_ENV"

      # Added to the release the windows job published; the hash of every file
      # is shown by GitHub beside it
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.windows.outputs.tag }}" "$package" --clobber

  # PyPI trusts this workflow through Trusted Publishing, so no token is stored
  # anywhere. The publisher is set up once on pypi.org: project trackhound,
  # owner mojave333, repository trackhound, workflow release.yml, environment pypi.
  pypi:
    needs: windows
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trackhound/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.windows.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # The version comes from trackhound/__init__.py; the tag already had to
      # agree with it, so a mismatch here means the wrong commit was checked out.
      - name: Check the version
        run: |
          tag="${{ needs.windows.outputs.tag }}"
          ls "dist/trackhound-${tag#v}-py3-none-any.whl"

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Once every file is up, Scoop's bucket, Homebrew's cask and the AUR and
  # winget files in this repository are pointed at the new release, with the
  # hashes GitHub computed for the files (scripts/package-managers.py). Scoop
  # and Homebrew read them from here; the AUR is updated by hand.
  packages:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}  # read by a step's if, which sees the job's env only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point the package managers at the release
        run: |
          python scripts/package-managers.py "${{ needs.windows.outputs.tag }}"
          git add bucket Casks packaging
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Point Scoop, Homebrew, the AUR and winget at ${{ needs.windows.outputs.tag }}"
          git pull --rebase
          git push

      # winget's catalogue is a pull request to microsoft/winget-pkgs. The first
      # version went in by hand; later ones go from here once a token with the
      # public_repo scope is stored as the WINGET_TOKEN secret, and not at all
      # without one.
      - name: Send the new version to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: mojave333.Trackhound
          release-tag: ${{ needs.windows.outputs.tag }}
          installers-regex: '-windows-x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
