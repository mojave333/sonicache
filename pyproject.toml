# The Python package on PyPI: the engine and the command line, with the window
# as an extra. The Windows build does not use this file; it is made by
# sonicache.spec from requirements.txt.
#
#     python -m build          # dist/sonicache-X.Y.Z.tar.gz and the wheel
#
# release.yml builds and publishes it together with the exe.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sonicache"
dynamic = ["version"]
description = "Download albums, playlists and tracks by link from Spotify, Apple Music, Deezer, YouTube and SoundCloud, tagged and with cover art"
readme = "docs/pypi.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "mojave333" }]
keywords = ["music", "downloader", "spotify", "deezer", "apple-music", "youtube-music", "soundcloud", "yt-dlp", "tags"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp[default]",
    "ytmusicapi",
    "mutagen",
    "requests[socks]",  # PySocks: a SOCKS proxy for urllib and requests
]

[project.optional-dependencies]
gui = ["pywebview"]

[project.scripts]
sonicache = "sonicache.cli:main"

[project.gui-scripts]
sonicache-gui = "sonicache.gui:main"

[project.urls]
Homepage = "https://github.com/mojave333/sonicache"
Issues = "https://github.com/mojave333/sonicache/issues"
Releases = "https://github.com/mojave333/sonicache/releases"

[tool.setuptools]
packages = ["sonicache", "sonicache.engine"]

[tool.setuptools.package-data]
sonicache = ["web/*", "web/art/*", "web/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "sonicache.__version__" }
