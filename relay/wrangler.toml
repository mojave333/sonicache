name = "sonicache-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

# Always run in Frankfurt (AWS eu-central-1), wherever the request comes in, so
# the request Spotify sees comes from Germany and never from a country it
# refuses. The answers say so in a cf-placement: remote-FRA header.
[placement]
mode = "targeted"
region = "aws:eu-central-1"
