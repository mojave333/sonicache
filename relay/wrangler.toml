name = "trackhound-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

# Tend to run near Spotify's servers rather than near the person asking, so the
# request Spotify sees is unlikely to come from a country it refuses. Region
# placement in the dashboard (AWS eu-central-1) pins it to Frankfurt instead;
# a deploy from here replaces that with what is written below.
[placement]
mode = "smart"
